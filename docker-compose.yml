services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      QDRANT_PATH: ./data/qdrant
      DOCUMENTS_DIR: data/documents
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # A named volume, not a host bind mount: SQLite's file-locking semantics
  # don't translate reliably across Docker Desktop's bind-mount filesystem
  # layer on Windows (observed as a bare "disk I/O error" on WAL/pragma
  # calls). A named volume is backed by the daemon's own native filesystem
  # and doesn't have that problem - the standard recommendation for a
  # database file, as opposed to config/source bind mounts.
  data:
